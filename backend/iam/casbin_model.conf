# [PermSys-Policy-011]
# Casbin PERM metamodel for BMS Project Management System.
#
# This model supports:
#   - Role-based access control (RBAC) with role hierarchy
#   - Domain/tenant-scoped roles (project-level isolation via g2)
#   - Resource-level deny overrides
#
# The model file is provided for documentation and for potential future
# migration to Casbin as the enforcement engine. The current implementation
# uses a custom Python engine (engine.py) that follows the same semantics.

[request_definition]
r = sub, obj, act, dom

[policy_definition]
p = sub, obj, act, dom, eft

[role_definition]
# g  = global role hierarchy (e.g. SuperAdmin inherits Admin)
g  = _, _
# g2 = project-scoped roles (user, role, project_id)
g2 = _, _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = (g(r.sub, p.sub) || g2(r.sub, p.sub, r.dom)) && \
    r.obj == p.obj && \
    r.act == p.act && \
    (p.dom == "*" || p.dom == r.dom)
