name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-tests:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the runtime in backend/Dockerfile.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # The cems suites are run on their own: collected alongside the rest they
      # error binding UUID parameters on the shared in-memory SQLite engine,
      # while in isolation they pass. Splitting the run keeps every test
      # executing — nothing is deselected — until that leak is fixed.
      - name: Run backend tests
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: pytest backend/tests --ignore=backend/tests/cems -q

      - name: Run cems tests
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: pytest backend/tests/cems -q

  build-and-push-backend:
    needs: [changes, backend-tests]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/project-management-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/project-management-backend:${{ github.sha }}
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/project-management-backend:buildcache', secrets.DOCKER_USERNAME) || 'type=gha' }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/project-management-backend:buildcache,mode=max', secrets.DOCKER_USERNAME) || 'type=gha,mode=max' }}

  build-and-push-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/project-management-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/project-management-frontend:${{ github.sha }}
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/project-management-frontend:buildcache', secrets.DOCKER_USERNAME) || 'type=gha' }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/project-management-frontend:buildcache,mode=max', secrets.DOCKER_USERNAME) || 'type=gha,mode=max' }}

  deploy:
    # backend-tests is listed so a red suite fails this job outright. Without it
    # the build would merely be skipped, which !failure() does not catch, and the
    # deploy hook would still fire.
    needs: [changes, backend-tests, build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !failure() && !cancelled() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    steps:
      - name: Deploy Backend to Render
        if: needs.changes.outputs.backend == 'true'
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            curl --fail-with-body -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK not set, skipping backend deploy"
          fi

      - name: Deploy Frontend to Render
        if: needs.changes.outputs.frontend == 'true'
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            curl --fail-with-body -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK not set, skipping frontend deploy"
          fi



